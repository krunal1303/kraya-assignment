version: '1.0'

services:
  postgres:
    image: postgres:16
    container_name: kraya-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: krayaDB

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes: 
  postgres_data:
